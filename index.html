<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Lua Auto Beautifier</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    padding:18px 15px;
    background:#0d0d0d;
    border-bottom:1px solid #252525;
}

.title{
    font-size:21px;
    font-weight:700;
    letter-spacing:.5px;
}

.subtitle{
    color:#777;
    font-size:12px;
    margin-top:5px;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:14px;
}

.toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

button,
.upload{
    min-height:42px;
    padding:10px 15px;
    border-radius:8px;
    border:1px solid #303030;
    background:#151515;
    color:#eee;
    font-size:13px;
    cursor:pointer;
}

button:hover,
.upload:hover{
    background:#202020;
}

.main{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.box{
    background:#0d0d0d;
    border:1px solid #272727;
    border-radius:10px;
    overflow:hidden;
}

.box-title{
    height:42px;
    display:flex;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid #252525;
    font-size:12px;
    color:#aaa;
}

textarea{
    width:100%;
    height:560px;
    display:block;
    resize:none;
    border:0;
    outline:0;
    padding:14px;
    background:#050505;
    color:#ddd;
    font-family:
        Consolas,
        "Courier New",
        monospace;
    font-size:13px;
    line-height:1.6;
    tab-size:4;
}

textarea::placeholder{
    color:#555;
}

.primary{
    background:#eee;
    color:#050505;
    border-color:#eee;
    font-weight:bold;
}

.info{
    margin-top:10px;
    color:#666;
    font-size:11px;
    text-align:center;
}

input[type=file]{
    display:none;
}

@media(max-width:700px){

    .main{
        grid-template-columns:1fr;
    }

    textarea{
        height:390px;
        font-size:12px;
    }

    .toolbar{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    button,
    .upload{
        width:100%;
        text-align:center;
    }

    .primary{
        grid-column:span 2;
    }
}
</style>

</head>

<body>

<header>
    <div class="title">LUA AUTO BEAUTIFIER</div>
    <div class="subtitle">
        Rapikan script Lua secara otomatis
    </div>
</header>

<div class="container">

```
<div class="toolbar">

    <label class="upload">
        📂 Upload Lua
        <input
            type="file"
            id="fileInput"
            accept=".lua,.txt"
        >
    </label>

    <button onclick="formatCode()">
        ✨ Beautify
    </button>

    <button onclick="copyOutput()">
        📋 Copy
    </button>

    <button onclick="clearCode()">
        🗑 Clear
    </button>

    <button class="primary" onclick="downloadLua()">
        ⬇ Download Lua
    </button>

</div>


<div class="main">

    <div class="box">

        <div class="box-title">
            INPUT — SCRIPT LUA
        </div>

        <textarea
            id="input"
            spellcheck="false"
            placeholder="Paste script Lua kamu di sini..."
        ></textarea>

    </div>


    <div class="box">

        <div class="box-title">
            OUTPUT — HASIL RAPI
        </div>

        <textarea
            id="output"
            spellcheck="false"
            readonly
            placeholder="Hasil beautify akan muncul di sini..."
        ></textarea>

    </div>

</div>

<div class="info">
    Semua proses berjalan langsung di browser HP — tidak menggunakan server.
</div>
```

</div>

<script>

/*
==================================================
 LUA AUTO BEAUTIFIER
==================================================
*/

const input =
    document.getElementById("input");

const output =
    document.getElementById("output");

const fileInput =
    document.getElementById("fileInput");


/*
==================================================
 UPLOAD
==================================================
*/

fileInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file) return;

        const reader =
            new FileReader();

        reader.onload =
            function(event){

                input.value =
                    event.target.result;

                output.value = "";

            };

        reader.readAsText(file);

    }
);


/*
==================================================
 TOKENIZER
==================================================

Tujuan:
- menjaga string agar tidak rusak
- menjaga komentar
- memisahkan simbol Lua
==================================================
*/

function tokenizeLua(code){

    const tokens = [];

    let i = 0;

    while(i < code.length){

        const char = code[i];

        /*
        STRING
        */

        if(
            char === '"' ||
            char === "'"
        ){

            const quote = char;

            let value = quote;

            i++;

            while(i < code.length){

                value += code[i];

                if(
                    code[i] === "\\" &&
                    i + 1 < code.length
                ){

                    i++;

                    value += code[i];

                }
                else if(
                    code[i] === quote
                ){

                    i++;

                    break;

                }

                i++;

            }

            tokens.push({
                type:"string",
                value:value
            });

            continue;
        }


        /*
        LONG STRING
        */

        if(
            code.substring(i,i+2) === "[["
        ){

            const end =
                code.indexOf(
                    "]]",
                    i + 2
                );

            if(end !== -1){

                tokens.push({
                    type:"string",
                    value:
                        code.substring(
                            i,
                            end + 2
                        )
                });

                i = end + 2;

                continue;
            }
        }


        /*
        COMMENT
        */

        if(
            code.substring(i,i+2) === "--"
        ){

            /*
            LONG COMMENT
            */

            if(
                code.substring(i,i+4) === "--[["
            ){

                const end =
                    code.indexOf(
                        "]]",
                        i + 4
                    );

                if(end !== -1){

                    tokens.push({
                        type:"comment",
                        value:
                            code.substring(
                                i,
                                end + 2
                            )
                    });

                    i = end + 2;

                    continue;
                }

            }


            /*
            SINGLE COMMENT
            */

            let end = i;

            while(
                end < code.length &&
                code[end] !== "\n"
            ){

                end++;

            }

            tokens.push({
                type:"comment",
                value:
                    code.substring(
                        i,
                        end
                    )
            });

            i = end;

            continue;
        }


        /*
        WHITESPACE
        */

        if(/\s/.test(char)){

            i++;

            continue;
        }


        /*
        MULTI SYMBOL
        */

        const two =
            code.substring(
                i,
                i + 2
            );

        const three =
            code.substring(
                i,
                i + 3
            );

        if(
            three === "..." ||
            three === "//="
        ){

            tokens.push({
                type:"symbol",
                value:three
            });

            i += 3;

            continue;
        }

        if(
            [
                "==",
                "~=",
                "<=",
                ">=",
                "..",
                "+=",
                "-=",
                "*=",
                "/=",
                "%=",
                "^="
            ].includes(two)
        ){

            tokens.push({
                type:"symbol",
                value:two
            });

            i += 2;

            continue;
        }


        /*
        IDENTIFIER / NUMBER
        */

        if(
            /[A-Za-z0-9_]/.test(char)
        ){

            let start = i;

            while(
                i < code.length &&
                /[A-Za-z0-9_.]/.test(code[i])
            ){

                i++;

            }

            tokens.push({
                type:"word",
                value:
                    code.substring(
                        start,
                        i
                    )
            });

            continue;
        }


        /*
        SYMBOL
        */

        tokens.push({
            type:"symbol",
            value:char
        });

        i++;

    }

    return tokens;
}


/*
==================================================
 FORMAT
==================================================
*/

function formatCode(){

    const code =
        input.value;

    if(!code.trim()){

        alert(
            "Masukkan atau upload script Lua terlebih dahulu."
        );

        return;
    }


    const tokens =
        tokenizeLua(code);


    let lines = [];

    let current = "";

    let indent = 0;


    function add(text){

        current += text;

    }


    function space(){

        if(
            current.length > 0 &&
            !current.endsWith(" ")
        ){

            current += " ";

        }

    }


    function flush(){

        const clean =
            current.trim();

        if(clean){

            lines.push(
                "    ".repeat(
                    Math.max(0,indent)
                ) + clean
            );

        }

        current = "";

    }


    /*
    BLOCK OPENERS
    */

    const blockWords = [
        "function",
        "then",
        "do",
        "repeat"
    ];


    /*
    BLOCK CLOSERS
    */

    const closeWords = [
        "end",
        "until"
    ];


    /*
    ELSE
    */

    const middleWords = [
        "else",
        "elseif"
    ];


    let previous = null;


    for(let n = 0; n < tokens.length; n++){

        const token =
            tokens[n];

        const value =
            token.value;


        /*
        COMMENT
        */

        if(
            token.type === "comment"
        ){

            flush();

            lines.push(
                "    ".repeat(
                    Math.max(0,indent)
                ) + value
            );

            previous = token;

            continue;
        }


        /*
        CLOSER
        */

        if(
            closeWords.includes(
                value
            )
        ){

            flush();

            indent =
                Math.max(
                    0,
                    indent - 1
                );

            add(value);

            /*
            until condition
            */

            if(
                value === "until"
            ){

                space();

            }
            else{

                flush();

            }

            previous = token;

            continue;
        }


        /*
        ELSE / ELSEIF
        */

        if(
            middleWords.includes(
                value
            )
        ){

            flush();

            indent =
                Math.max(
                    0,
                    indent - 1
                );

            add(value);

            if(
                value === "elseif"
            ){

                space();

            }
            else{

                flush();

            }

            previous = token;

            continue;
        }


        /*
        STRING
        */

        if(
            token.type === "string"
        ){

            if(
                current &&
                !current.endsWith(" ")
            ){

                space();

            }

            add(value);

            previous = token;

            continue;
        }


        /*
        COMMA
        */

        if(value === ","){

            current =
                current.trimEnd();

            add(", ");

            previous = token;

            continue;
        }


        /*
        SEMICOLON
        */

        if(value === ";"){

            current =
                current.trimEnd();

            flush();

            previous = token;

            continue;
        }


        /*
        OPEN PAREN
        */

        if(value === "("){

            current =
                current.trimEnd();

            add("(");

            previous = token;

            continue;
        }


        /*
        CLOSE PAREN
        */

        if(value === ")"){

            current =
                current.trimEnd();

            add(")");

            previous = token;

            continue;
        }


        /*
        OPEN BRACKET
        */

        if(value === "["){

            current =
                current.trimEnd();

            add("[");

            previous = token;

            continue;
        }


        /*
        CLOSE BRACKET
        */

        if(value === "]"){

            current =
                current.trimEnd();

            add("]");

            previous = token;

            continue;
        }


        /*
        DOT
        */

        if(value === "."){

            current =
                current.trimEnd();

            add(".");

            previous = token;

            continue;
        }


        /*
        COLON
        */

        if(value === ":"){

            current =
                current.trimEnd();

            add(":");

            previous = token;

            continue;
        }


        /*
        OPERATORS
        */

        if(
            [
                "=",
                "==",
                "~=",
                "<",
                ">",
                "<=",
                ">=",
                "+",
                "-",
                "*",
                "/",
                "%",
                "^",
                "..",
                "+=",
                "-=",
                "*=",
                "/="
            ].includes(value)
        ){

            current =
                current.trimEnd();

            add(
                " " +
                value +
                " "
            );

            previous = token;

            continue;
        }


        /*
        BLOCK OPEN
        */

        if(
            blockWords.includes(
                value
            )
        ){

            space();

            add(value);

            /*
            function:
            hanya tambah indent setelah
            baris function selesai.

            then / do:
            juga tambah indent.
            */

            if(
                value === "function"
            ){

                space();

            }
            else{

                flush();

                indent++;

            }

            previous = token;

            continue;
        }


        /*
        NORMAL WORD
        */

        if(
            token.type === "word"
        ){

            /*
            Jika setelah function:
            */

            if(
                previous &&
                previous.value === "function"
            ){

                add(value);

            }
            else{

                if(
                    current &&
                    !current.endsWith(" ") &&
                    !current.endsWith("(") &&
                    !current.endsWith("[") &&
                    !current.endsWith(".")
                ){

                    space();

                }

                add(value);

            }

            previous = token;

            continue;
        }


        /*
        DEFAULT SYMBOL
        */

        if(
            current &&
            !current.endsWith(" ")
        ){

            space();

        }

        add(value);

        previous = token;

    }


    flush();


    /*
    ==============================================
    SECOND PASS
    ==============================================
    */


    let finalLines = [];

    for(let line of lines){

        line =
            line.replace(
                /[ \t]+$/g,
                ""
            );

        /*
        Rapikan function declaration
        */

        line =
            line.replace(
                /\bfunction\s+([A-Za-z_][A-Za-z0-9_.:]*)\s*\(/g,
                "function $1("
            );

        /*
        Rapikan if/for/while
        */

        line =
            line.replace(
                /\s+(then|do)\s*$/,
                " $1"
            );

        /*
        Jangan ada spasi berlebihan
        */

        line =
            line.replace(
                / {2,}/g,
                " "
            );

        /*
        Kembalikan indent
        */

        const match =
            line.match(/^(\s*)/);

        const existingIndent =
            match ? match[1] : "";

        const content =
            line.trim();

        finalLines.push(
            existingIndent +
            content
        );

    }


    output.value =
        finalLines.join("\n");

}


/*
==================================================
 COPY
==================================================
*/

async function copyOutput(){

    if(!output.value){

        alert(
            "Belum ada hasil beautify."
        );

        return;
    }

    try{

        await navigator.clipboard.writeText(
            output.value
        );

        alert(
            "Hasil berhasil dicopy."
        );

    }
    catch{

        output.select();

        document.execCommand("copy");

        alert(
            "Hasil berhasil dicopy."
        );

    }

}


/*
==================================================
 DOWNLOAD
==================================================
*/

function downloadLua(){

    if(!output.value){

        alert(
            "Beautify script terlebih dahulu."
        );

        return;
    }

    const blob =
        new Blob(
            [output.value],
            {
                type:"text/plain"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "beautified.lua";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}


/*
==================================================
 CLEAR
==================================================
*/

function clearCode(){

    input.value = "";

    output.value = "";

    fileInput.value = "";

}

</script>

</body>
</html>
