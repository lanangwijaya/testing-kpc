<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lua Deobfuscator Analyzer</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#090909;
    color:#eee;
    font-family:Arial,sans-serif;
}
header{
    padding:20px 16px;
    border-bottom:1px solid #242424;
    background:#0d0d0d;
}
.logo{
    font-size:21px;
    font-weight:bold;
    letter-spacing:1px;
}
.sub{
    color:#777;
    font-size:12px;
    margin-top:5px;
}
.wrap{
    max-width:1000px;
    margin:auto;
    padding:16px;
}
.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
}
button,.file{
    border:1px solid #333;
    background:#151515;
    color:#eee;
    padding:11px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}
button:hover,.file:hover{
    background:#202020;
}
.primary{
    background:#eee;
    color:#000;
    border-color:#eee;
}
input[type=file]{display:none}
textarea{
    width:100%;
    min-height:430px;
    resize:vertical;
    background:#050505;
    color:#ddd;
    border:1px solid #292929;
    border-radius:10px;
    padding:15px;
    outline:none;
    font-family:Consolas,monospace;
    font-size:13px;
    line-height:1.55;
}
textarea:focus{
    border-color:#555;
}
.panel{
    margin-top:14px;
    border:1px solid #252525;
    border-radius:10px;
    background:#0d0d0d;
    padding:14px;
}
.panel h3{
    margin:0 0 10px;
    font-size:14px;
}
#status{
    color:#888;
    font-size:12px;
}
.result{
    white-space:pre-wrap;
    font-family:Consolas,monospace;
    font-size:12px;
    color:#bbb;
    line-height:1.6;
}
.badge{
    display:inline-block;
    border:1px solid #333;
    padding:5px 8px;
    border-radius:6px;
    margin:3px;
    font-size:11px;
}
.warn{
    border-color:#684f00;
    color:#d9b84c;
}
.ok{
    border-color:#315b3a;
    color:#8fd19e;
}
@media(max-width:600px){
    header{padding:16px 12px}
    .wrap{padding:12px}
    textarea{min-height:350px;font-size:12px}
    button,.file{flex:1}
}
</style>

</head>

<body>

<header>
    <div class="logo">LUA DEOBFUSCATOR</div>
    <div class="sub">Beautify • Analyze • String / Decoder Detector</div>
</header>

<div class="wrap">

```
<div class="toolbar">

    <label class="file">
        📂 Upload Lua
        <input id="fileInput" type="file" accept=".lua,.txt">
    </label>

    <button onclick="beautify()">✨ Beautify</button>

    <button onclick="analyze()">🔎 Analyze</button>

    <button onclick="clearAll()">🗑 Clear</button>

    <button class="primary" onclick="downloadLua()">⬇ Download Lua</button>

</div>

<textarea id="code" placeholder="Paste script Lua di sini..."></textarea>

<div class="panel">
    <h3>ANALYSIS</h3>
    <div id="status">Belum ada analisis.</div>
    <div id="result" class="result"></div>
</div>
```

</div>

<script>
const codeBox = document.getElementById("code");
const result = document.getElementById("result");
const statusBox = document.getElementById("status");
const fileInput = document.getElementById("fileInput");

/* =========================
   UPLOAD FILE
========================= */

fileInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        codeBox.value = e.target.result;

        statusBox.textContent =
            "Loaded: " + file.name +
            " (" + Math.round(file.size/1024) + " KB)";

        result.textContent = "";

    };

    reader.readAsText(file);
});


/* =========================
   BASIC LUA BEAUTIFIER
========================= */

function beautify(){

    let code = codeBox.value;

    if(!code.trim()){
        alert("Masukkan script Lua terlebih dahulu.");
        return;
    }

    let lines = code
        .replace(/\r/g,"")
        .split("\n");

    let indent = 0;
    let output = [];

    const decrease = /^(end|until|else|elseif)\b/i;

    const increase =
        /\b(then|do|function|repeat)\s*$/i;

    for(let raw of lines){

        let line = raw.trim();

        if(!line){
            output.push("");
            continue;
        }

        if(decrease.test(line)){
            indent = Math.max(0,indent-1);
        }

        output.push("    ".repeat(indent) + line);

        if(/^else\b/i.test(line) ||
           /^elseif\b/i.test(line)){
            indent++;
        }
        else if(increase.test(line)){
            indent++;
        }

        if(/\bend\s*[,;]?\s*$/i.test(line) &&
           !/^end\b/i.test(line)){
            indent = Math.max(0,indent-1);
        }
    }

    codeBox.value = output.join("\n");

    statusBox.textContent =
        "Beautify selesai • " +
        output.length +
        " baris";

}


/* =========================
   ANALYZER
========================= */

function analyze(){

    const code = codeBox.value;

    if(!code.trim()){
        alert("Masukkan script Lua terlebih dahulu.");
        return;
    }

    let found = [];

    function detect(label,regex,description){

        const match = code.match(regex);

        if(match){
            found.push({
                label,
                count:match.length,
                description
            });
        }

    }

    detect(
        "string.byte",
        /\bstring\s*\.\s*byte\b/g,
        "Membaca nilai byte dari string."
    );

    detect(
        "string.char",
        /\bstring\s*\.\s*char\b/g,
        "Membuat karakter dari nilai byte."
    );

    detect(
        "string.sub",
        /\bstring\s*\.\s*sub\b/g,
        "Mengambil potongan string."
    );

    detect(
        "table.concat",
        /\btable\s*\.\s*concat\b/g,
        "Menggabungkan isi table menjadi string."
    );

    detect(
        "table.insert",
        /\btable\s*\.\s*insert\b/g,
        "Memasukkan data ke dalam table."
    );

    detect(
        "loadstring",
        /\bloadstring\b/g,
        "Memuat string sebagai kode Lua."
    );

    detect(
        "load",
        /\bload\s*\(/g,
        "Memuat kode Lua dari string."
    );

    detect(
        "require",
        /\brequire\s*\(/g,
        "Memanggil ModuleScript/module."
    );

    detect(
        "getfenv",
        /\bgetfenv\b/g,
        "Mengakses environment function."
    );

    detect(
        "setfenv",
        /\bsetfenv\b/g,
        "Mengubah environment function."
    );

    detect(
        "hex escape",
        /\\x[0-9a-fA-F]{2}/g,
        "Ditemukan karakter escape hexadecimal."
    );

    detect(
        "decimal escape",
        /\\[0-9]{2,3}/g,
        "Ditemukan escape angka."
    );

    detect(
        "very long string",
        /["'][^"'\n]{300,}["']/g,
        "Ada string sangat panjang yang dapat berisi data ter-encode."
    );

    detect(
        "byte loop",
        /for\s+\w+\s*=\s*0x?0+\s*,\s*0x?FF/i,
        "Ada loop yang berjalan pada rentang byte 0–255."
    );


    /* =========================
       REPORT
    ========================= */

    let html = "";

    html +=
        "Detected patterns: " +
        found.length +
        "\n\n";

    if(found.length === 0){

        html +=
        "Tidak ditemukan pola decoder umum.\n";

    }
    else{

        for(const item of found){

            html +=
            "[" + item.label + "] " +
            item.count +
            " occurrence(s)\n" +
            "  → " +
            item.description +
            "\n\n";

        }

    }


    /* =========================
       SIMPLE STRUCTURE
    ========================= */

    const functions =
        (code.match(/\bfunction\b/g)||[]).length;

    const locals =
        (code.match(/\blocal\b/g)||[]).length;

    const strings =
        (code.match(/(["'])/g)||[]).length / 2;

    const lines =
        code.split("\n").length;

    html += "-------------------------\n";
    html += "STRUCTURE\n";
    html += "-------------------------\n";
    html += "Lines      : " + lines + "\n";
    html += "Functions  : " + functions + "\n";
    html += "Local vars : " + locals + "\n";
    html += "Strings    : " + Math.floor(strings) + "\n\n";


    /* =========================
       POSSIBLE LOADER
    ========================= */

    const loader =
        /\b(loadstring|load)\s*\(/.test(code);

    if(loader){

        html +=
        "⚠ POSSIBLE CODE LOADER\n" +
        "Script menggunakan load/loadstring.\n" +
        "Periksa bagian yang menghasilkan string sebelum fungsi tersebut dipanggil.\n\n";

    }


    /* =========================
       DECODER EXPLANATION
    ========================= */

    const decoder =
        /string\s*\.\s*(byte|char|sub)/.test(code) &&
        /table\s*\.\s*concat/.test(code);

    if(decoder){

        html +=
        "ℹ POSSIBLE STRING DECODER\n" +
        "Kombinasi string.byte/string.sub/string.char " +
        "dengan table.concat sering digunakan untuk mengubah " +
        "data string menjadi bentuk lain.\n\n";

    }


    result.textContent = html;

    statusBox.textContent =
        "Analysis selesai • " +
        found.length +
        " pola terdeteksi";

}


/* =========================
   DOWNLOAD
========================= */

function downloadLua(){

    const code = codeBox.value;

    if(!code.trim()){
        alert("Tidak ada kode untuk didownload.");
        return;
    }

    const blob =
        new Blob([code],{
            type:"text/plain"
        });

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "deobfuscated.lua";

    document.body.appendChild(a);
    a.click();

    a.remove();

    URL.revokeObjectURL(url);

}


/* =========================
   CLEAR
========================= */

function clearAll(){

    codeBox.value = "";

    result.textContent = "";

    statusBox.textContent =
        "Belum ada analisis.";

    fileInput.value = "";

}
</script>

</body>
</html>
